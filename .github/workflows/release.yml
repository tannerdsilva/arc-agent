name: Release

# Publishes prebuilt arc-agent binaries as GitHub Release assets, which is
# what `install.sh` (download mode) fetches.
#
# Source of truth: this build pipeline needs access to BOTH repositories —
# arc-agent (public) and tessera (currently private, used via a path
# dependency). Configure a fine-grained (or classic) PAT with read access to
# Escalante-Inc/tessera as the repository secret `ARC_TESSERA_TOKEN`.
#
# Triggered by pushing a tag `v*`, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# If tessera is made public, `ARC_TESSERA_TOKEN` can be dropped (default token
# works for public checkouts).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout arc-agent
        uses: actions/checkout@v4
        with:
          path: arc-agent
          fetch-depth: 1

      - name: Checkout tessera (path dependency)
        uses: actions/checkout@v4
        with:
          repository: Escalante-Inc/tessera
          ref: dev
          token: ${{ secrets.ARC_TESSERA_TOKEN }}
          path: tessera
          fetch-depth: 1

      - name: Show toolchain
        run: swift --version

      - name: Build release binaries
        run: swift build -c release
        working-directory: arc-agent

      - name: Package tarball
        run: |
          mkdir -p staging
          cp arc-agent/.build/release/arc staging/
          cp arc-agent/.build/release/arc-agent-webui staging/
          cp arc-agent/README.md staging/ 2>/dev/null || true
          cp arc-agent/LICENSE staging/ 2>/dev/null || true
          tar czf arc-agent-latest-macos-arm64.tar.gz -C staging .
      - name: Hash tarball
        run: shasum -a 256 arc-agent-latest-macos-arm64.tar.gz | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arc-agent-latest-macos-arm64.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
