<div class="main-view"><div class="main-scroll" data-scroll-key="tasks-main"><form id="task-form" class="task-add" data-component-id="tasks"><input id="task-edit-id" name="task-edit-id" type="hidden" value="job-1"><div class="task-form-top"><h2 class="todo-title">Edit job</h2><div class="row-actions-main" style="margin: 0px;" data-component-id="tasks" data-event="click"><button id="task-cancel" class="ghost-btn" type="button" title="Cancel"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><button id="task-submit" class="primary-btn" type="submit" title="Save job"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button></div></div><label class="task-field">Name<span class="task-opt">optional — defaults to Untitled job</span><input id="task-name" name="task-name" type="text" placeholder="Optional" value="Morning digest" autocomplete="off"></label><label class="task-field">Job kind<span class="task-sched"><select id="task-kind" name="task-kind" data-component-id="task-kind" data-event="change"><option value="recurring" selected>Recurring (cron / interval)</option><option value="oneshot">One-shot (runs once)</option><option value="manual">Run anytime (no schedule)</option></select></span><p class="task-preview">Fires on the schedule below, forever.</p></label><label class="task-field">Schedule<span class="task-sched"><select id="task-preset" name="task-preset" data-component-id="task-sched-preset" data-event="change"><option value="every">Every …</option><option value="daily">Daily at time</option><option value="weekly">Weekly on weekday</option><option value="custom" selected>Custom cron</option></select><input id="task-custom" name="task-custom" type="text" placeholder="0 9 * * 1-5" value="70 9 * * *" data-component-id="task-sched-custom" data-event="change"></span><p class="task-preview">70 9 * * * · Time is server time; cron runs server-side.</p></label><label class="task-field">Prompt<textarea id="task-prompt" name="task-prompt" rows="4" placeholder="What should the agent run?">Summarise the inbox and send the digest.</textarea></label><label class="task-field">Deliver output to<select id="task-deliver-preset" name="task-deliver-preset" data-component-id="task-deliver-preset" data-event="change"><option value="local" selected>Local (save output only)</option><option value="custom">Custom target…</option></select></label><label class="task-field">Profile<select id="task-profile" name="task-profile"><option value="" selected>Server default</option></select><span class="task-opt">Runs under the server default profile when unset.</span></label></form></div></div>
