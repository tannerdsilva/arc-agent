<div class="panel-head">
  <span class="panel-title">Logs</span>
  <button type="button" id="log-clear" title="Clear logs" data-component-id="log-clear" class="icon-mini"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
</div>
<div class="panel-body">
  <div class="log-stats">
    <span class="log-stat" title="Info lines"><span class="dot dot-info"></span>1 info</span>
    <span class="log-stat" title="Warning lines"><span class="dot dot-warn"></span>1 warn</span>
    <span class="log-stat" title="Error lines"><span class="dot dot-err"></span>2 error</span>
  </div>
  <div class="log-chips" data-component-id="log-filter" data-event="click"><button type="button" id="log-filter-all" class="chip-btn active" aria-pressed="true">All</button><button type="button" id="log-filter-info" class="chip-btn" aria-pressed="false">Info</button><button type="button" id="log-filter-warn" class="chip-btn" aria-pressed="false">Warn</button><button type="button" id="log-filter-error" class="chip-btn" aria-pressed="false">Error</button></div>
  <div class="log-panel-note">In-app log stream. Captured lines from this process appear here instead of the terminal.</div>
</div>
