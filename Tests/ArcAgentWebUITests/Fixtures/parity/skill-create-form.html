<div class="main-view"><div id="main-scroll" class="main-scroll" data-scroll-key="main-scroll"><form id="skill-create-form" class="detail-card skill-form" data-component-id="skill-create-form"><h1 class="detail-title">New skill</h1><div class="detail-sub">A skill is a SKILL.md file with YAML frontmatter (name, description) found under the skills directory.</div><div class="form-grid"><div><label for="skill-name-input">Name<span class="req-tag">Required</span></label><input id="skill-name-input" name="skill-name-input" placeholder="my-skill" data-component-id="skill-name-input" data-event="input" class="text-input"><span class="inline-err" id="skill-name-err" hidden></span></div><div class="field"><div class="field__row"><label class="field__label" for="skill-cat-input">Category</label></div><input id="skill-cat-input" name="skill-cat-input" placeholder="e.g. devops" data-component-id="skill-cat-input" data-event="input"></div><div><label for="skill-desc-input">Description<span class="req-tag">Required</span></label><input id="skill-desc-input" name="skill-desc-input" placeholder="Short description" data-component-id="skill-desc-input" data-event="input" class="text-input"><span class="inline-err" id="skill-desc-err" hidden></span></div><div class="field"><div class="field__row"><label class="field__label" for="skill-content-input">Content (Markdown)</label></div><textarea id="skill-content-input" name="skill-content-input" rows="0" placeholder="How to use this skill…" data-component-id="skill-content-input" data-event="input"></textarea></div></div><div class="row-actions-main"><button class="primary-btn" type="submit">Create skill</button><button id="skill-cancel" data-component-id="skill-cancel" class="ghost-btn" type="button">Cancel</button></div></form></div></div>
