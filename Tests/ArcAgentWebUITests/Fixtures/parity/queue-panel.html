<div class="todo-card queue-card" data-component-id="queue" data-event="click"><div class="todo-head"><div><h2 class="todo-title">Run queue</h2><div class="todo-sub">Tasks run in the order shown. Sequential feeds linked output; parallel runs each chat at once.</div></div><div class="todo-head-actions"><div class="queue-ctrl"><div class="queue-ctrl-btns"><button id="queue-run-sync" class="queue-run-btn" type="button" title="Run tasks in the shown order; linked tasks receive earlier output as context"><span class="queue-run-ico"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>Run sequential</button><button id="queue-run-async" class="queue-run-btn" type="button" title="Run each chat at the same time; same-chat tasks are combined"><span class="queue-run-ico"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg></span>Run parallel</button><button id="queue-picker-toggle" class="queue-add-btn" type="button"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add tasks</button></div><div class="queue-loop-row"><label class="queue-loop-toggle" title="Repeat the sequential run; linked later tasks feed back on the next pass"><span class="switch"><input id="queue-loop-toggle" type="checkbox" value="1" data-component-id="queue-loop-toggle" data-event="change"><span class="track"></span><span class="knob"></span></span><span class="queue-loop-label">Loop sequential</span></label></div></div></div></div><div class="queue-list"><div class="todo-empty"><div class="todo-empty-ico"><svg class="icon icon--xl" viewBox="0 0 24 24" width="1.5em" height="1.5em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg></div><div>Nothing queued yet</div><small>Add todos from any chat below, drag to reorder, then run them.</small></div></div><input id="queue-order" type="hidden" value="" data-component-id="queue-order" data-event="change" data-no-restore=""></div>
