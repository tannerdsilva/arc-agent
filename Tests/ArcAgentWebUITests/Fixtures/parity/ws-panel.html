<div id="ws-panel" class="ws-panel">
  <div class="panel-head ws-head">
    <span class="panel-title">Workspace</span>
    <div class="ws-tools" data-component-id="workspace" data-event="click">
      <button type="button" id="w-new" title="New file" class="icon-mini"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button type="button" id="w-newfolder" title="New folder" class="icon-mini"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
      <button type="button" id="w-upload" title="Upload files or drop them here" class="icon-mini"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
      <div class="ws-menu-wrap" data-component-id="workspace" data-event="click">
  <button type="button" id="w-menu" class="icon-mini" title="Workspace options">⋮</button>
  <div class="chat-menu ws-menu" id="ws-menu">
    <button type="button" id="w-hidden" class=""><span class="chk"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg></span> Show hidden files</button>
  </div>
</div>
      <button type="button" id="w-close" title="Close workspace" class="icon-mini"><svg class="icon icon--sm" viewBox="0 0 24 24" width="0.75em" height="0.75em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </div>
  <form id="ws-new-form" data-component-id="ws-new-form" class="cat-add-form">
  <div class="detail-sub" style="margin-bottom:6px">New file</div>
  <input id="ws-new-name" name="ws-new-name" data-component-id="ws-new-name" type="text" placeholder="file name (e.g. notes.txt)" autofocus>
  <input type="hidden" name="ws-new-kind" value="file">
  <div class="cat-add-actions" style="margin-top:8px">
    <button type="submit" class="primary-btn">Create</button>
    <button type="button" id="ws-new-cancel" class="ghost-btn">Cancel</button>
  </div>
</form>
  <div class="ws-body" id="ws-tree" data-component-id="workspace" data-event="click" data-root="/arc/parity/workspace">
    <div class="ws-path" title="/arc/parity/workspace">/arc/parity/workspace</div>
<div class="empty-hint">This workspace is empty.</div>
  </div>
</div>
